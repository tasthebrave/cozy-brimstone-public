workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Add iOS Platform
        script: |
          ./node_modules/.bin/cap add ios
      - name: Sync Capacitor project
        script: |
          ./node_modules/.bin/cap sync ios
      - name: Build iOS Package
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/outputs -exportOptionsPlist App/ExportOptions.plist
    artifacts:
      - build/outputs/*.ipa
