workflows:
  ios-capacitor-workflow:
    name: iOS Capacitor Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Create fallback directory
        script: |
          mkdir -p www
          echo "<html><body>Fallback workspace assets window</body></html>" > www/index.html
      - name: Add iOS Platform
        script: |
          ./node_modules/.bin/cap add ios
      - name: Sync Capacitor project
        script: |
          ./node_modules/.bin/cap sync ios
      - name: Build iOS Simulator Package
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO
          mkdir -p build/outputs
          mv /Users/builder/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphonesimulator/App.app build/outputs/App.app
          cd build/outputs && zip -r CozyBrimstone.app.zip App.app
    artifacts:
      - ios/App/build/outputs/*.zip
